name: Test multitenant foundation

on:
  pull_request:
    paths:
      - 'supabase/**'
      - 'supabase_schema.sql'
      - 'scripts/*.test.mjs'
      - 'scripts/mobile-ui/**'
      - 'scripts/mobile-*.mjs'
      - 'playwright.mobile.config.mjs'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-tenancy.yml'
  push:
    branches: [main, feat/multitenant-foundation, feat/klooyd-mobile]
    paths:
      - 'supabase/**'
      - 'supabase_schema.sql'
      - 'scripts/*.test.mjs'
      - 'scripts/mobile-ui/**'
      - 'scripts/mobile-*.mjs'
      - 'playwright.mobile.config.mjs'
      - 'frontend/**'
      - 'package.json'
      - 'package-lock.json'
      - '.github/workflows/test-tenancy.yml'

permissions:
  contents: read

jobs:
  database:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --test scripts/performance.test.mjs
      - run: npm run test:launch
      - run: npm run test:daily-close
      - run: npm run test:mobile
      - run: npm run test:mobile-gateway
      - run: node --test scripts/inventory.test.mjs
      - run: npm run test:tenancy
      - run: npm run test:branding
      - run: npm run test:qr
      - run: npm ci --prefix frontend
      - run: npm run lint --prefix frontend
      - run: npm run build --prefix frontend
      - run: npx playwright install --with-deps chromium
      - run: npm run test:mobile-ui
